<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101a34">
  <meta name="description" content="Gravity Run — سباق جاذبية عمودي ضد البوت، بثلاث مراحل. لعبة ويب مناسبة لـ Telegram Mini Apps.">
  <title>Gravity Run — سباق الجاذبية</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Gravity Run"><span class="brand-mark">↕</span><span>GRAVITY<br><b>RUN</b></span></a>
      <div class="stage-pill" id="stagePill">المرحلة <b id="stageNumber">1</b> من 3</div>
      <button class="icon-button" id="soundButton" aria-label="تشغيل أو إيقاف الصوت" title="الصوت">♪</button>
    </header>

    <section class="game-wrap" aria-label="ساحة اللعبة">
      <canvas id="gameCanvas" aria-label="لعبة Gravity Run. المس الشاشة لتبديل الجاذبية."></canvas>
      <div class="hud">
        <div class="race-status"><span class="live-dot"></span><span id="statusText">استعد للسباق!</span></div>
        <div class="runner-labels"><span class="runner-tag blue-tag"><i></i> أنت</span><span class="runner-tag red-tag"><i></i> البوت</span></div>
      </div>
      <div class="tap-hint" id="tapHint"><span class="tap-icon">👆</span><span>المس الشاشة لتبديل الجاذبية</span></div>
      <div class="overlay" id="overlay">
        <div class="card" id="overlayCard">
          <div class="card-emblem" id="cardEmblem">↕</div>
          <p class="eyebrow" id="eyebrow">تحدي الجاذبية</p>
          <h1 id="overlayTitle">جاهز للانطلاق؟</h1>
          <p class="card-copy" id="overlayCopy">تسابق ضد البوت عبر ثلاث مراحل عمودية. بدّل الجاذبية لتتفادى الحواجز وتجنّب السقوط!</p>
          <button class="primary-button" id="startButton">ابدأ السباق <span>←</span></button>
          <p class="small-note" id="smallNote">المس الشاشة أو اضغط Space لتبديل الجاذبية</p>
        </div>
      </div>
    </section>
    <footer class="bottom-bar"><span>ثلاث مراحل · سباق ضد البوت</span><span class="control-tip">المس للتبديل <kbd>SPACE</kbd></span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
